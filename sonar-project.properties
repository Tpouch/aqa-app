sonar.projectKey=Tpouch_aqa-app_c853032c-9be2-49e2-bb95-e773e3ab5e2b

# Test files are analysed as tests, not as source to cover.
sonar.tests=.
sonar.test.inclusions=server/test/**,web/src/**/*.test.ts,web/src/**/*.test.tsx
sonar.exclusions=server/test/**,web/src/**/*.test.ts,web/src/**/*.test.tsx

# Generated by `npm run test:coverage` (see .github/workflows/quality-check.yml).
sonar.javascript.lcov.reportPaths=server/coverage/lcov.info,web/coverage/lcov.info
sonar.coverage.exclusions=server/scripts/**,**/vite.config.ts,**/vitest.config.ts
