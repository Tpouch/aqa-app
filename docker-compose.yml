# docker compose up -d --build
#
# Configuration comes only from environment variables, so a platform such as
# Coolify asks for them in its UI. Locally, docker compose reads them from a
# `.env` file next to this one (see .env.example).
# Variables marked `:?` are required: the deployment stops if they are empty.
#
# The app is published on every interface of the host, port 3090 (container
# port 3000), so a reverse proxy on another machine of the network (Nginx Proxy
# Manager…) can reach it at http://<host IP>:3090. Don't forward this port on
# the router: only the proxy should be exposed to the Internet.

services:
  app:
    build: .
    image: aqa-app
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required (at least 12 characters)}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required (at least 32 characters)}
      PUBLIC_URL: ${PUBLIC_URL:-https://sensor.devgoblin.fr}
      RETENTION_DAYS: ${RETENTION_DAYS:-0}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      # Named volume: Docker creates it with the image's /data ownership (user
      # "node"), so SQLite can write. A host folder (./data) would be owned by
      # root and the app would fail with "unable to open database file".
      - aqa-data:/data
    ports:
      - "3090:3000"

volumes:
  aqa-data:
