<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // Same rule as src/theme.ts readTheme: dark unless "light" was chosen.
      (function () {
        var t = "dark";
        try { if (localStorage.getItem("aqa-theme") === "light") t = "light"; } catch (e) {}
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23121311'/><rect x='8' y='8' width='16' height='16' fill='%23e9e5dc'/></svg>" />
    <title>AQA · Capteurs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
